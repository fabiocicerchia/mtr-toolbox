site_name: mtr-toolbox
site_description: >-
  A versioned network-diagnostics image you can name in a runbook and get
  the same bits next month.
repo_url: https://github.com/fabiocicerchia/mtr-toolbox
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
